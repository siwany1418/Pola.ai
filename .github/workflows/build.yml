
name: Build Pola APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pola-app.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q pola-app.zip -d extracted
          test -f extracted/pola-app/app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/pola-app
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp extracted/pola-app/app/build/outputs/apk/debug/app-debug.apk pola.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pola-APK
          path: pola.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pola APK build ${{ github.run_number }}
          files: pola.apk
